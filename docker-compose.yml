name: bh-admin

services:
  admin:
    build: .
    image: shadowkick/admin:latest
    container_name: admin
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8793
      AUTH_ISSUER: http://localhost:8788
      AUTH_CLIENT_ID: admin
      # То же самое значение, что в Auth/Финансах/Movies/Trip на локальной машине.
      ADMIN_INTERNAL_KEY: dev-admin-key
      # Необязательно — вкладка «Импорт» у Puzzle без него просто отвечает
      # 503. Реальное значение — в .env рядом с этим compose (см. README,
      # тот же приём, что у ADMIN_INTERNAL_KEY на проде), сюда не хардкодить.
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      # Health-check по расписанию (см. server.js runHealthCheck) — раз в час
      # проверяет сервисы и без RESEND_API_KEY просто логирует письмо вместо
      # отправки, сам health-check при этом всё равно считается и хранится.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: BurningHouse <noreply@burninghouse.ru>
      PUBLIC_URL: http://localhost:8793
      SERVICES_JSON: >-
        [{"id":"auth","name":"Вход","baseUrl":"http://localhost:8788"},
         {"id":"finance","name":"Мои финансы","baseUrl":"http://localhost:8787"},
         {"id":"movies","name":"Что смотрим?","baseUrl":"http://localhost:8792"},
         {"id":"trip","name":"Куда поедем?","baseUrl":"http://localhost:8790"},
         {"id":"puzzle","name":"Что собираем?","baseUrl":"http://localhost:8796"}]
    ports:
      - "127.0.0.1:8793:8793"
    volumes:
      - admin-data:/app/data

# Единственное, что тут хранится — флаг «известная проблема» и последний
# результат health-check (см. server.js) — переживает рестарт/редеплой,
# остальной Admin по-прежнему без своей базы.
volumes:
  admin-data:
