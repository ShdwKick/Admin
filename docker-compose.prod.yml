name: bh-admin

services:
  admin:
    image: shadowkick/admin:latest
    container_name: admin
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      HOST: 0.0.0.0
      PORT: 8793
      AUTH_ISSUER: https://auth.burninghouse.ru
      AUTH_CLIENT_ID: admin
      # ОБЯЗАТЕЛЬНО. Общий секрет с /internal/* остальных сервисов — то же самое
      # значение должно быть в Auth, Финансах, Movies, Trip. Берётся из файла
      # .env рядом с этим compose (права 600), в репозиторий не попадает.
      # Пустым или с юникодом внутри Admin вообще не запустится (см. server.js),
      # а не упадёт на первом запросе. Сгенерировать: openssl rand -hex 32
      ADMIN_INTERNAL_KEY: ${ADMIN_INTERNAL_KEY:-}
      # Необязательно — ключ pexels.com для вкладки «Импорт» у Puzzle
      # (быстрое наполнение библиотеки готовыми фото). Без него вкладка
      # отвечает 503, остальной Admin работает как обычно. Тот же приём,
      # что у ADMIN_INTERNAL_KEY — значение в .env, сюда не хардкодить.
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      # Health-check по расписанию (см. server.js runHealthCheck) — раз в час
      # проверяет сервисы из SERVICES_JSON, письмо шлёт только если кто-то не
      # ответил. Тот же RESEND_API_KEY/MAIL_FROM, что у Trip — своя запись в
      # .env ЭТОГО сервиса всё равно нужна, .env между сервисами не общий,
      # даже если значение то же самое.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-BurningHouse <noreply@burninghouse.ru>}
      PUBLIC_URL: https://admin.burninghouse.ru
      # Какие сервисы показывать. Один из них обязан иметь id "auth" —
      # через него идёт управление пользователями.
      SERVICES_JSON: >-
        [{"id":"auth","name":"Вход","baseUrl":"https://auth.burninghouse.ru"},
         {"id":"finance","name":"Мои финансы","baseUrl":"https://money.burninghouse.ru"},
         {"id":"movies","name":"Что смотрим?","baseUrl":"https://movies.burninghouse.ru"},
         {"id":"trip","name":"Куда поедем?","baseUrl":"https://trip.burninghouse.ru"},
         {"id":"puzzle","name":"Что собираем?","baseUrl":"https://puzzle.burninghouse.ru"}]
      # Сервис должен быть зарегистрирован в auth как клиент (справочно, выполняется
      # один раз руками на сервере):
      #   docker compose exec auth node server.js client-add admin "Админка" https://admin.burninghouse.ru/
      # А хотя бы один аккаунт должен получить доступ:
      #   docker compose exec auth node server.js make-admin <логин>
    ports:
      # Только на localhost — наружу отдаёт nginx на 443 (см. deploy/nginx-admin-443.conf).
      - "127.0.0.1:8793:8793"
    volumes:
      - admin-data:/app/data

# Единственное, что тут хранится — флаг «известная проблема» и последний
# результат health-check (см. server.js) — переживает рестарт/редеплой,
# остальной Admin по-прежнему без своей базы.
volumes:
  admin-data:
