# Админка на admin.burninghouse.ru, стандартный порт 443.
# Кладётся в /etc/nginx/sites-available/admin и линкуется в sites-enabled.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.burninghouse.ru;

    ssl_certificate     /etc/letsencrypt/live/admin.burninghouse.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.burninghouse.ru/privkey.pem;

    # Ручная загрузка картинки в библиотеку Puzzle идёт через Admin как
    # base64 внутри JSON (см. server.js, readJsonBody(req, 6 * 1024 * 1024)
    # на /api/services/:id/puzzles) — у nginx свой лимит тела запроса 1 МБ по
    # умолчанию, без этой строки любая загрузка крупнее отваливалась бы 413
    # ещё до самого Admin (тот же приём и то же число, что у Puzzle,
    # deploy/nginx-puzzle-443.conf).
    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:8793;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.burninghouse.ru;
    return 301 https://$host$request_uri;
}
