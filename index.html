<meta charset="utf-8">
<title>Админка · BurningHouse</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/brand.css">
<link rel="stylesheet" href="assets/styles.css">

<!-- Горящий дом под всем приложением, приглушённый вариант — здесь работают,
     а не любуются. Искры — bh-sparks--pulse: вспыхивают дискретно, не горят
     ровно, потому что это телеметрия, а не очаг (см. Design/motion.md). -->
<div class="bh-backdrop bh-backdrop--page bh-backdrop--quiet" aria-hidden="true">
  <div class="bh-layer"><div class="bh-glow"></div></div>
  <div class="bh-layer"><div class="bh-haze"></div></div>
  <div class="bh-layer bh-sparks bh-sparks--pulse" data-bh-sparks="5"></div>
</div>

<div class="bh-page">
  <div class="bh-topbar">
    <a class="bh-lockup" href="/" aria-label="BurningHouse — Админка">
      <svg class="bh-mark" viewBox="0 0 24 24" aria-hidden="true">
        <defs>
          <linearGradient id="bhFlameBar" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0" stop-color="var(--flame-base, #581c87)"/>
            <stop offset="1" stop-color="var(--flame-tip, #c77dff)"/>
          </linearGradient>
        </defs>
        <path class="bh-flame" fill="url(#bhFlameBar)" fill-rule="evenodd"
              d="M12 1.2C13.6 5 16.4 6.6 18.2 9.4C21.4 14.4 18.6 22.4 12 22.4C5.4 22.4 2.6 14.4 5.8 9.4C7.2 7.2 9.2 6 10.2 3.4C10.9 5.6 11.4 6.6 12 7.4C12.4 5.6 12.3 3.4 12 1.2ZM12 9.8 7.4 13.6V19.2H16.6V13.6Z"/>
      </svg>
      <span class="bh-name">BurningHouse</span>
      <span class="bh-sep" aria-hidden="true"></span>
      <span class="bh-service">Админка</span>
    </a>
    <div class="bh-who" id="whoBox" style="display:none">
      <span id="whoName"></span>
      <button id="logoutBtn">Выйти</button>
    </div>
  </div>

  <main id="app">
    <div class="bh-empty">Загрузка…</div>
  </main>
</div>

<script src="assets/brand.js"></script>
<script src="assets/auth-client-browser.js"></script>
<script src="assets/app.js"></script>
